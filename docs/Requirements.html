<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDo App — Project Checklist</title>
<style>
  :root {
    --bg: #faf9f5;
    --card: #ffffff;
    --border: rgba(0,0,0,0.12);
    --text: #1a1a18;
    --muted: #6b6a64;
    --faint: #9b9a92;
    --green: #1d9e75;
    --track: #edebe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 14px; color: var(--muted); margin: 0 0 24px; }

  .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-head span:first-child { font-size: 14px; color: var(--muted); }
  #pct { font-size: 20px; font-weight: 500; }
  .bar-track { height: 8px; background: var(--track); border-radius: 8px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: var(--green); transition: width 0.25s ease; }
  #count { font-size: 13px; color: var(--faint); margin: 8px 0 28px; }

  .ms {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }
  .ms-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ms-head h2 { font-size: 15px; font-weight: 500; margin: 0; flex: 1; }
  .msc { font-size: 12px; color: var(--faint); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  label.t {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; font-size: 14px; cursor: pointer;
    border-top: 1px solid var(--border);
  }
  label.t input { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; cursor: pointer; }
  label.t.done { color: var(--faint); text-decoration: line-through; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1b; --card: #292825; --border: rgba(255,255,255,0.14);
      --text: #ecebe6; --muted: #a3a29a; --faint: #7c7b74; --track: #3a3935;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ToDo app — project checklist</h1>
  <p class="sub">Five milestones, frontend to E2E tests.</p>

  <div class="progress-head"><span>Overall progress</span><span id="pct">0%</span></div>
  <div class="bar-track"><div id="bar"></div></div>
  <p id="count">0 of 31 tasks done</p>

  <section class="ms">
    <div class="ms-head"><span class="dot" style="background:#7f77dd"></span><h2>Milestone 1 — frontend</h2><span class="msc">0/9</span></div>
    <label class="t"><input type="checkbox"> Create git repo, initial commit</label>
    <label class="t"><input type="checkbox"> Scaffold React app with Vite</label>
    <label class="t"><input type="checkbox"> Configure routing</label>
    <label class="t"><input type="checkbox"> Add React Hook Form</label>
    <label class="t"><input type="checkbox"> Add Yup validation</label>
    <label class="t"><input type="checkbox"> List all tasks view</label>
    <label class="t"><input type="checkbox"> Add task, shows instantly</label>
    <label class="t"><input type="checkbox"> Edit existing task</label>
    <label class="t"><input type="checkbox"> Delete existing task</label>
  </section>

  <section class="ms">
    <div class="ms-head"><span class="dot" style="background:#1d9e75"></span><h2>Milestone 2 — backend</h2><span class="msc">0/9</span></div>
    <label class="t"><input type="checkbox"> Set up Express project</label>
    <label class="t"><input type="checkbox"> Prisma connected to database</label>
    <label class="t"><input type="checkbox"> Task schema + migration</label>
    <label class="t"><input type="checkbox"> GET /tasks endpoint</label>
    <label class="t"><input type="checkbox"> POST /tasks endpoint</label>
    <label class="t"><input type="checkbox"> PUT /tasks/:id endpoint</label>
    <label class="t"><input type="checkbox"> DELETE /tasks/:id endpoint</label>
    <label class="t"><input type="checkbox"> Swagger docs for all endpoints</label>
    <label class="t"><input type="checkbox"> Postman collection exported</label>
  </section>

  <section class="ms">
    <div class="ms-head"><span class="dot" style="background:#d85a30"></span><h2>Milestone 3 — integration</h2><span class="msc">0/5</span></div>
    <label class="t"><input type="checkbox"> Frontend fetches tasks from API</label>
    <label class="t"><input type="checkbox"> New task persists to database</label>
    <label class="t"><input type="checkbox"> Updates persist</label>
    <label class="t"><input type="checkbox"> Deletes are permanent</label>
    <label class="t"><input type="checkbox"> Loading and error states</label>
  </section>

  <section class="ms">
    <div class="ms-head"><span class="dot" style="background:#378add"></span><h2>Milestone 4 — deployment</h2><span class="msc">0/4</span></div>
    <label class="t"><input type="checkbox"> CI/CD pipeline builds on push</label>
    <label class="t"><input type="checkbox"> Frontend hosted on S3</label>
    <label class="t"><input type="checkbox"> Backend hosted on EC2</label>
    <label class="t"><input type="checkbox"> API base URL + CORS configured</label>
  </section>

  <section class="ms">
    <div class="ms-head"><span class="dot" style="background:#d4537e"></span><h2>Milestone 5 — E2E tests</h2><span class="msc">0/4</span></div>
    <label class="t"><input type="checkbox"> Playwright or Cypress set up</label>
    <label class="t"><input type="checkbox"> Tests: list and add task</label>
    <label class="t"><input type="checkbox"> Tests: edit and delete task</label>
    <label class="t"><input type="checkbox"> E2E suite runs in pipeline</label>
  </section>
</div>

<script>
  var boxes = document.querySelectorAll('label.t input');
  var total = boxes.length;

  function update() {
    var done = 0;
    document.querySelectorAll('.ms').forEach(function (ms) {
      var b = ms.querySelectorAll('label.t input');
      var d = 0;
      b.forEach(function (cb) {
        cb.parentElement.classList.toggle('done', cb.checked);
        if (cb.checked) d++;
      });
      ms.querySelector('.msc').textContent = d + '/' + b.length;
      done += d;
    });
    var pct = Math.round((done / total) * 100);
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('count').textContent = done + ' of ' + total + ' tasks done';
  }

  boxes.forEach(function (cb) { cb.addEventListener('change', update); });
  update();
</script>
</body>
</html>
